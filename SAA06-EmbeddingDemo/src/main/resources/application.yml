server:
  port: 8893
  servlet:
    encoding:
      enabled: true
      force: true
      charset: utf-8
spring:
  application:
    name: saa06-Embedding
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3-max  # 指定文本模型
      embedding:
        options:
          model: qwen3.7-text-embedding  # 指定向量化模型

